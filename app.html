<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Checkout | Premium Order</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- MATTE & MINIMAL THEME --- */
        :root {
            /* Light Theme Defaults (Matte) */
            --bg-color: #F5F5F7;
            --surface-color: #FFFFFF;
            --text-main: #1D1D1F;
            --text-muted: #86868B;
            --border-color: #E5E5EA;
            --primary-color: #111111; /* Πολύ σκούρο γκρι αντί για απόλυτο μαύρο */
            --danger-color: #D70015;  
            --radius: 8px;
            --shadow-subtle: 0 4px 24px rgba(0,0,0,0.04);
        }

        body.dark-theme {
            /* Dark Theme Defaults (Matte) */
            --bg-color: #000000;
            --surface-color: #1C1C1E;
            --text-main: #F5F5F7;
            --text-muted: #8E8E93;
            --border-color: #38383A;
            --primary-color: #FFFFFF;
            --shadow-subtle: 0 4px 24px rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Manrope', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 120px; transition: background-color 0.4s ease; }

        /* HEADER */
        header {
            position: sticky; top: 0; background: rgba(var(--bg-color), 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 16px 24px; border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; z-index: 100;
        }
        .back-btn { 
            background: none; border: none; color: var(--text-main); font-size: 13px; font-weight: 500; 
            cursor: pointer; display: flex; align-items: center; gap: 4px; letter-spacing: 0.5px;
        }
        #shopTitle { font-size: 14px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; position: absolute; left: 50%; transform: translateX(-50%); opacity: 0.9; }

        .container { padding: 32px 24px; max-width: 640px; margin: 0 auto; }

        /* TABLE INPUT (Sleek) */
        .table-input-wrapper { margin-bottom: 40px; }
        .table-input-wrapper label { display: block; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .table-input-wrapper input {
            width: 100%; border: none; background: transparent; color: var(--text-main); font-size: 20px; font-weight: 400; outline: none; 
            border-bottom: 1px solid var(--border-color); padding-bottom: 12px; transition: border-color 0.3s ease;
        }
        .table-input-wrapper input:focus { border-bottom-color: var(--primary-color); }
        .table-input-wrapper input::placeholder { color: var(--border-color); }

        /* MENU LIST & ANIMATIONS */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .category-title { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin: 48px 0 16px 0; }
        
        .product-item {
            display: flex; justify-content: space-between; align-items: flex-start;
            padding: 24px 0; border-bottom: 1px solid var(--border-color);
            opacity: 0; animation: slideUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .product-info { flex: 1; padding-right: 24px; }
        .product-name { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
        .product-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 12px; font-weight: 300; }
        .product-price { font-size: 14px; font-weight: 400; color: var(--text-main); }
        
        .add-btn {
            background: transparent; border: 1px solid var(--border-color); color: var(--text-main);
            width: 36px; height: 36px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s ease;
        }
        .add-btn svg { width: 14px; height: 14px; }
        .add-btn:active { background: var(--text-main); color: var(--bg-color); transform: scale(0.96); }

        /* CART SUMMARY (Bottom Overlay) */
        .cart-overlay {
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--surface-color);
            border-top: 1px solid var(--border-color); box-shadow: var(--shadow-subtle);
            transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); z-index: 200;
            padding-bottom: env(safe-area-inset-bottom); border-radius: 20px 20px 0 0;
        }
        .cart-overlay.active { transform: translateY(0); }
        
        .cart-header { padding: 20px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .cart-header span { font-size: 13px; font-weight: 600; letter-spacing: 0.5px; color: var(--text-main); }
        .cart-close { background: none; border: none; color: var(--text-muted); font-size: 24px; font-weight: 300; cursor: pointer; transition: color 0.2s; }
        .cart-close:hover { color: var(--text-main); }

        .cart-items-container { max-height: 45vh; overflow-y: auto; padding: 0 24px; }
        
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--border-color); }
        .cart-item-name { font-size: 14px; font-weight: 500; flex: 1; color: var(--text-main); }
        .cart-item-controls { display: flex; align-items: center; gap: 16px; margin: 0 16px; }
        .qty-btn { background: none; border: none; color: var(--text-muted); font-size: 18px; font-weight: 300; cursor: pointer; padding: 4px; transition: color 0.2s; }
        .qty-btn:active { color: var(--text-main); }
        .qty-num { font-size: 14px; font-weight: 500; min-width: 16px; text-align: center; }
        .cart-item-price { font-size: 14px; font-weight: 400; width: 60px; text-align: right; color: var(--text-main);}

        /* CART FOOTER */
        .cart-footer { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .cart-total-box { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; }
        .cart-total-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .cart-total-value { font-size: 24px; font-weight: 300; color: var(--text-main); line-height: 1; }
        
        .cart-actions { display: flex; gap: 12px; width: 100%; }
        
        .cancel-btn {
            background: transparent; color: var(--text-main); border: 1px solid var(--border-color);
            padding: 16px; font-size: 12px; font-weight: 600; letter-spacing: 1px;
            cursor: pointer; transition: all 0.3s ease; flex: 1; border-radius: var(--radius);
        }
        .cancel-btn:active { background: var(--border-color); }
        
        .checkout-btn {
            background: var(--primary-color); color: var(--bg-color); border: none; padding: 16px;
            font-size: 12px; font-weight: 600; letter-spacing: 1px;
            cursor: pointer; transition: opacity 0.3s ease; flex: 2; border-radius: var(--radius);
        }
        .checkout-btn:active { opacity: 0.8; }

        /* FLOATING CART TRIGGER */
        .floating-trigger {
            position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
            background: var(--surface-color); color: var(--text-main); padding: 14px 28px; border-radius: 40px;
            display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 500; letter-spacing: 0.5px;
            border: 1px solid var(--border-color); box-shadow: var(--shadow-subtle); cursor: pointer; 
            opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: 150;
        }
        .floating-trigger.visible { opacity: 1; pointer-events: auto; }
        .floating-badge { background: var(--text-main); color: var(--bg-color); width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <button class="back-btn" onclick="safeBackRedirect()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 18l-6-6 6-6"/></svg>
            Back
        </button>
        <div id="shopTitle"></div>
        <div style="width: 50px;"></div> </header>

    <div class="container">
        <div class="table-input-wrapper">
            <label>Table or Area</label>
            <input type="text" id="tableNumber" placeholder="e.g. 12" required autocomplete="off">
        </div>

        <div id="orderingList">
            <p style="text-align:center; color: var(--text-muted); margin-top: 60px; font-size: 13px; font-weight: 300;">Loading selection...</p>
        </div>
    </div>

    <div class="floating-trigger" id="floatingTrigger" onclick="toggleCart()">
        View Order <span class="floating-badge" id="floatingBadge">0</span>
    </div>

    <div class="cart-overlay" id="cartOverlay">
        <div class="cart-header">
            <span>Summary</span>
            <button class="cart-close" onclick="toggleCart()">×</button>
        </div>
        <div class="cart-items-container" id="cartItems">
            </div>
        <div class="cart-footer">
            <div class="cart-total-box">
                <div>
                    <div class="cart-total-label">Estimated Total</div>
                    <div class="cart-total-value" id="cartTotal">€0.00</div>
                </div>
            </div>
            <div class="cart-actions">
                <button class="cancel-btn" onclick="cancelOrder()">Clear</button>
                <button class="checkout-btn" onclick="submitOrder()">Submit Order</button>
            </div>
        </div>
    </div>

    <script>
        let shopData = null;
        let cart = {}; 

        // Safely go back to the menu without 404
        function safeBackRedirect() {
            if (document.referrer && document.referrer.includes('shop=')) {
                window.location.href = document.referrer;
            } else {
                window.history.back();
            }
        }

        async function initApp() {
            const urlParams = new URLSearchParams(window.location.search);
            const shopId = urlParams.get('shopId') || 'menu'; 

            try {
                // FETCH MENU
                const res = await fetch(`https://yxdoaj8thk.execute-api.eu-central-1.amazonaws.com/Prod/menu?shopId=${shopId}`);
                if (!res.ok) throw new Error("Network error");
                shopData = await res.json();
                
                applyTheme(shopData.settings, shopId);
                renderOrderingList(shopData.menu);

            } catch (error) {
                document.getElementById('orderingList').innerHTML = `<p style="text-align:center; color: var(--text-muted); margin-top: 60px; font-size: 13px;">Unable to load the menu at this time.</p>`;
            }
        }

        function applyTheme(settings, shopId) {
            const titleEl = document.getElementById('shopTitle');
            titleEl.innerText = shopId;
            
            if (settings) {
                if (settings.logo_url) titleEl.innerHTML = `<img src="${settings.logo_url}" height="20" alt="Logo" style="opacity: 0.9;">`;
                
                // Δυναμικός Χαμαιλέοντας, αλλά ελέγχουμε να μην χάσει το "Matte" ύφος.
                const mode = settings.themeMode || 'dark'; // Προεπιλογή σε σκούρο αν δεν οριστεί
                if (mode === 'dark') document.body.classList.add('dark-theme');
                
                // Αν το primary color είναι έντονο, το εφαρμόζουμε διακριτικά
                if (settings.primaryColor) {
                    document.documentElement.style.setProperty('--primary-color', settings.primaryColor);
                }
            }
        }

        function renderOrderingList(menuArray) {
            const container = document.getElementById('orderingList');
            container.innerHTML = '';

            let delayCounter = 0; // Για το staggered animation

            menuArray.forEach(category => {
                const catTitle = document.createElement('h2');
                catTitle.className = 'category-title';
                catTitle.innerText = category.title;
                container.appendChild(catTitle);

                category.items.forEach(item => {
                    const numericPrice = parseFloat(item.price.replace(/[^0-9.-]+/g,""));
                    const div = document.createElement('div');
                    div.className = 'product-item';
                    div.style.animationDelay = `${delayCounter * 0.05}s`; // Staggered εφέ
                    
                    div.innerHTML = `
                        <div class="product-info">
                            <div class="product-name">${item.name}</div>
                            ${item.description ? `<div class="product-desc">${item.description}</div>` : ''}
                            <div class="product-price">${item.price}</div>
                        </div>
                        <button class="add-btn" onclick="updateCart('${item.name.replace(/'/g, "\\'")}', ${numericPrice}, 1)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        </button>
                    `;
                    container.appendChild(div);
                    delayCounter++;
                });
            });
        }

        // --- CART LOGIC ---
        function updateCart(name, price, change) {
            if (!cart[name]) {
                if (change > 0) cart[name] = { price: price, qty: change };
            } else {
                cart[name].qty += change;
                if (cart[name].qty <= 0) delete cart[name];
            }
            refreshCartUI();
        }

        function refreshCartUI() {
            const itemsContainer = document.getElementById('cartItems');
            itemsContainer.innerHTML = '';
            
            let total = 0;
            let totalItems = 0;

            for (const [name, data] of Object.entries(cart)) {
                total += data.price * data.qty;
                totalItems += data.qty;

                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                itemDiv.innerHTML = `
                    <div class="cart-item-name">${name}</div>
                    <div class="cart-item-controls">
                        <button class="qty-btn" onclick="updateCart('${name.replace(/'/g, "\\'")}', ${data.price}, -1)">−</button>
                        <span class="qty-num">${data.qty}</span>
                        <button class="qty-btn" onclick="updateCart('${name.replace(/'/g, "\\'")}', ${data.price}, 1)">+</button>
                    </div>
                    <div class="cart-item-price">€${(data.price * data.qty).toFixed(2)}</div>
                `;
                itemsContainer.appendChild(itemDiv);
            }

            document.getElementById('cartTotal').innerText = `€${total.toFixed(2)}`;
            document.getElementById('floatingBadge').innerText = totalItems;

            const trigger = document.getElementById('floatingTrigger');
            if (totalItems > 0) {
                trigger.classList.add('visible');
            } else {
                trigger.classList.remove('visible');
                document.getElementById('cartOverlay').classList.remove('active'); 
            }
        }

        function toggleCart() {
            if(Object.keys(cart).length === 0) return;
            document.getElementById('cartOverlay').classList.toggle('active');
        }

        // Ακύρωση Παραγγελίας - Ασφαλές 404 fix
        function cancelOrder() {
            if(confirm("Are you sure you want to clear your order?")) {
                cart = {}; 
                safeBackRedirect();
            }
        }

        async function submitOrder() {
            const table = document.getElementById('tableNumber').value.trim();
            if (!table) {
                alert("Please enter your table or area number to proceed.");
                document.getElementById('tableNumber').focus();
                document.getElementById('cartOverlay').classList.remove('active');
                return;
            }

            const shopId = new URLSearchParams(window.location.search).get('shopId') || 'nissos';

            // 1. Προετοιμασία των προϊόντων στη μορφή που θέλει η βάση (Array of Objects)
            const orderItems = Object.keys(cart).map(itemName => ({
                name: itemName,
                price: cart[itemName].price,
                quantity: cart[itemName].qty
            }));

            // 2. Υπολογισμός συνολικού ποσού
            const totalAmount = Object.values(cart).reduce((sum, item) => sum + (item.price * item.qty), 0);

            // 3. Το τελικό JSON Payload (Ακριβώς όπως το περιμένει το Java Backend σου)
            const payload = {
                shopId: shopId,
                tableNumber: table,
                orderItem: orderItems,
                totalAmount: parseFloat(totalAmount.toFixed(2))
                // Σημείωση: Το orderId, το createdAt και το status="NEW" λογικά τα δημιουργεί αυτόματα η Java σου.
            };

            console.log("Sending Payload:", payload);

            // Οπτικό feedback στο κουμπί
            const checkoutBtn = document.querySelector('.checkout-btn');
            const originalText = checkoutBtn.innerText;
            checkoutBtn.innerText = "SENDING...";
            checkoutBtn.disabled = true;

            try {
                const response = await fetch(`https://yxdoaj8thk.execute-api.eu-central-1.amazonaws.com/Prod/orders`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                console.log("Order Success!");
                alert("Order submitted successfully! The kitchen is preparing your items.");

                // clear bucket and return to the menu
                cart = {};
                document.getElementById('tableNumber').value = '';
                refreshCartUI();
                document.getElementById('cartOverlay').classList.remove('active');
                safeBackRedirect();

            } catch (error) {
                console.error("Order submission failed:", error);
                alert("Failed to send order. Please try again or call a waiter.");
            } finally {
                checkoutBtn.innerText = originalText;
                checkoutBtn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
